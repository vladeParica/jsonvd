name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  bundle:
    name: Bundle for PGXN
    runs-on: ubuntu-latest
    container: pgxn/pgxn-tools
    env:
      PGXN_USERNAME: ${{ secrets.PGXN_USERNAME }}
      PGXN_PASSWORD: ${{ secrets.PGXN_PASSWORD }}
    outputs:
      bundle: ${{ steps.bundle.outputs.bundle }}
    steps:
      - uses: actions/checkout@v5
      - name: Check that the tag matches the extension version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "default_version = '${version}'" jsonvd.control
          grep -q "\"version\": \"${version}\"" META.json
          test -f "sql/jsonvd--${version}.sql"
      - name: Bundle
        id: bundle
        run: pgxn-bundle
      - uses: actions/upload-artifact@v7
        with:
          name: pgxn-bundle
          path: ${{ steps.bundle.outputs.bundle }}
      - name: Publish to PGXN (only when PGXN credentials are configured)
        if: env.PGXN_USERNAME != ''
        run: pgxn-release

  github-release:
    name: GitHub release
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: pgxn-bundle
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## " v "( |$)" {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ needs.bundle.outputs.bundle }}
        run: |
          asset="$(basename "$BUNDLE")"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$asset" --title "jsonvd ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
          fi
